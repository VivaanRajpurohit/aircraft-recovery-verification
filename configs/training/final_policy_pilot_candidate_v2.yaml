dataset_id: final_policy_pilot_v2
output_root: datasets/candidate_policy_data
aircraft_config: configs/aircraft/simple_twin.yaml
fallback_config: configs/controllers/fallback.yaml
maximum_steps_per_flight: 300
label_semantics: expert_proposed_action
flights:
  # Training: three independently seeded examples per tier.
  - {scenario: configs/scenarios/phase2_nominal.yaml, seed: 15000, split: train, difficulty_tier: 0, scenario_family: nominal, severity_band: none, initial_state_overrides: {airspeed_kts: 128, altitude_ft: 6000, pitch_deg: -3, roll_deg: -15}}
  - {scenario: configs/scenarios/policy_partial_aileron.yaml, seed: 15001, split: train, difficulty_tier: 1, scenario_family: control_only, severity_band: mild, failure_overrides: {aileron_loss_policy: {severity: 0.25, activation_time_seconds: 5.0}}}
  - {scenario: configs/scenarios/phase2_single_engine.yaml, seed: 15002, split: train, difficulty_tier: 2, scenario_family: engine_only, severity_band: moderate, initial_state_overrides: {airspeed_kts: 135, pitch_deg: 4, roll_deg: 12}}
  - {scenario: configs/scenarios/phase2_engine_aileron.yaml, seed: 15003, split: train, difficulty_tier: 3, scenario_family: engine_control, severity_band: moderate, failure_overrides: {aileron_loss_1: {severity: 0.50, activation_time_seconds: 4.0}}}
  - {scenario: configs/scenarios/phase2_actuator_turbulence_thrust.yaml, seed: 15004, split: train, difficulty_tier: 4, scenario_family: delay_disturbance_thrust, severity_band: severe_in_domain, environment_overrides: {turbulence_intensity: 0.20}}
  - {scenario: configs/scenarios/phase2_engine_aileron.yaml, seed: 15005, split: train, difficulty_tier: 5, scenario_family: boundary_concurrent, severity_band: boundary, initial_state_overrides: {altitude_ft: 3000, airspeed_kts: 112, pitch_deg: 10, roll_deg: 32}, failure_overrides: {aileron_loss_1: {severity: 0.75, activation_time_seconds: 2.5}}}
  - {scenario: configs/scenarios/phase2_nominal.yaml, seed: 15006, split: train, difficulty_tier: 0, scenario_family: nominal, severity_band: none, initial_state_overrides: {airspeed_kts: 150, altitude_ft: 9500, pitch_deg: 5, roll_deg: 18}}
  - {scenario: configs/scenarios/policy_partial_aileron.yaml, seed: 15007, split: train, difficulty_tier: 1, scenario_family: control_only, severity_band: mild, failure_overrides: {aileron_loss_policy: {severity: 0.35, activation_time_seconds: 7.0}}}
  - {scenario: configs/scenarios/phase2_sensor_actuator.yaml, seed: 15008, split: train, difficulty_tier: 2, scenario_family: sensor_delay, severity_band: moderate, failure_overrides: {elevator_loss_1: {severity: 0.45}, actuator_delay_1: {severity: 0.45, parameters: {maximum_delay_seconds: 0.5}}}}
  - {scenario: configs/scenarios/phase2_rudder_crosswind.yaml, seed: 15009, split: train, difficulty_tier: 3, scenario_family: engine_control, severity_band: moderate, failure_overrides: {rudder_loss_1: {severity: 0.45}, crosswind_1: {severity: 0.45}}}
  - {scenario: configs/scenarios/phase2_engine_aileron.yaml, seed: 15010, split: train, difficulty_tier: 4, scenario_family: engine_control, severity_band: severe_in_domain, failure_overrides: {aileron_loss_1: {severity: 0.70}}}
  - {scenario: configs/scenarios/phase2_sensor_actuator.yaml, seed: 15011, split: train, difficulty_tier: 5, scenario_family: boundary_sensor_delay, severity_band: boundary, initial_state_overrides: {altitude_ft: 2500, airspeed_kts: 108, pitch_deg: -12, roll_deg: -35}, environment_overrides: {turbulence_intensity: 0.25}}
  - {scenario: configs/scenarios/phase2_nominal.yaml, seed: 15012, split: train, difficulty_tier: 0, scenario_family: nominal, severity_band: none, initial_state_overrides: {airspeed_kts: 138, altitude_ft: 7800, pitch_deg: 0, roll_deg: 0}}
  - {scenario: configs/scenarios/phase3_partial_thrust.yaml, seed: 15013, split: train, difficulty_tier: 1, scenario_family: engine_partial, severity_band: mild, failure_overrides: {partial_thrust: {severity: 0.30, activation_time_seconds: 6.0}}}
  - {scenario: configs/scenarios/policy_partial_aileron.yaml, seed: 15014, split: train, difficulty_tier: 2, scenario_family: control_only, severity_band: moderate, failure_overrides: {aileron_loss_policy: {severity: 0.60, activation_time_seconds: 3.0}}}
  - {scenario: configs/scenarios/phase2_actuator_turbulence_thrust.yaml, seed: 15015, split: train, difficulty_tier: 3, scenario_family: delay_disturbance_thrust, severity_band: moderate, failure_overrides: {actuator_delay_1: {severity: 0.45, parameters: {maximum_delay_seconds: 0.5}}, turbulence_1: {severity: 0.40}, thrust_loss_1: {severity: 0.40}}}
  - {scenario: configs/scenarios/phase2_rudder_crosswind.yaml, seed: 15016, split: train, difficulty_tier: 4, scenario_family: engine_control, severity_band: severe_in_domain, failure_overrides: {rudder_loss_1: {severity: 0.70}, crosswind_1: {severity: 0.65}}}
  - {scenario: configs/scenarios/phase2_engine_aileron.yaml, seed: 15017, split: train, difficulty_tier: 5, scenario_family: boundary_concurrent, severity_band: boundary, initial_state_overrides: {altitude_ft: 2200, airspeed_kts: 118, pitch_deg: 14, roll_deg: -38}, environment_overrides: {turbulence_intensity: 0.25}, failure_overrides: {aileron_loss_1: {severity: 0.80}}}

  # Development: one flight per tier.
  - {scenario: configs/scenarios/phase2_nominal.yaml, seed: 15018, split: development, difficulty_tier: 0, scenario_family: nominal, severity_band: none, initial_state_overrides: {airspeed_kts: 145, altitude_ft: 7200, pitch_deg: 3, roll_deg: -10}}
  - {scenario: configs/scenarios/policy_partial_aileron.yaml, seed: 15019, split: development, difficulty_tier: 1, scenario_family: control_only, severity_band: mild, failure_overrides: {aileron_loss_policy: {severity: 0.30, activation_time_seconds: 4.0}}}
  - {scenario: configs/scenarios/phase2_single_engine.yaml, seed: 15020, split: development, difficulty_tier: 2, scenario_family: engine_only, severity_band: moderate, initial_state_overrides: {airspeed_kts: 132, roll_deg: -18}}
  - {scenario: configs/scenarios/phase2_engine_aileron.yaml, seed: 15021, split: development, difficulty_tier: 3, scenario_family: engine_control, severity_band: moderate, failure_overrides: {aileron_loss_1: {severity: 0.58, activation_time_seconds: 3.5}}}
  - {scenario: configs/scenarios/phase2_actuator_turbulence_thrust.yaml, seed: 15022, split: development, difficulty_tier: 4, scenario_family: delay_disturbance_thrust, severity_band: severe_in_domain, environment_overrides: {turbulence_intensity: 0.28}}
  - {scenario: configs/scenarios/phase2_engine_aileron.yaml, seed: 15023, split: development, difficulty_tier: 5, scenario_family: boundary_concurrent, severity_band: boundary, initial_state_overrides: {altitude_ft: 2800, airspeed_kts: 115, pitch_deg: -10, roll_deg: 36}, failure_overrides: {aileron_loss_1: {severity: 0.78}}}

  # Challenge: held-out activation/severity combinations, still development-visible.
  - {scenario: configs/scenarios/phase2_nominal.yaml, seed: 15024, split: challenge, difficulty_tier: 0, scenario_family: nominal, severity_band: none, initial_state_overrides: {airspeed_kts: 125, altitude_ft: 5200, pitch_deg: 7, roll_deg: 20}}
  - {scenario: configs/scenarios/phase3_partial_thrust.yaml, seed: 15025, split: challenge, difficulty_tier: 1, scenario_family: engine_partial, severity_band: mild, failure_overrides: {partial_thrust: {severity: 0.38, activation_time_seconds: 7.5}}}
  - {scenario: configs/scenarios/phase2_sensor_actuator.yaml, seed: 15026, split: challenge, difficulty_tier: 2, scenario_family: sensor_delay, severity_band: moderate, failure_overrides: {elevator_loss_1: {severity: 0.55}, actuator_delay_1: {severity: 0.50, parameters: {maximum_delay_seconds: 0.6}}}}
  - {scenario: configs/scenarios/phase2_rudder_crosswind.yaml, seed: 15027, split: challenge, difficulty_tier: 3, scenario_family: engine_control, severity_band: moderate, failure_overrides: {rudder_loss_1: {severity: 0.60}, crosswind_1: {severity: 0.55}}}
  - {scenario: configs/scenarios/phase2_engine_aileron.yaml, seed: 15028, split: challenge, difficulty_tier: 4, scenario_family: engine_control, severity_band: severe_in_domain, failure_overrides: {aileron_loss_1: {severity: 0.73, activation_time_seconds: 5.5}}}
  - {scenario: configs/scenarios/phase2_sensor_actuator.yaml, seed: 15029, split: challenge, difficulty_tier: 5, scenario_family: boundary_sensor_delay, severity_band: boundary, initial_state_overrides: {altitude_ft: 1800, airspeed_kts: 105, pitch_deg: 15, roll_deg: 40}, environment_overrides: {turbulence_intensity: 0.30}}

  # OOD-style simulator stress: unseen seeds and compositions of supported factors.
  - {scenario: configs/scenarios/phase2_nominal.yaml, seed: 15030, split: ood_stress, difficulty_tier: 0, scenario_family: nominal, severity_band: none, initial_state_overrides: {airspeed_kts: 155, altitude_ft: 10000, pitch_deg: -5, roll_deg: -20}}
  - {scenario: configs/scenarios/policy_partial_aileron.yaml, seed: 15031, split: ood_stress, difficulty_tier: 1, scenario_family: control_only, severity_band: mild, failure_overrides: {aileron_loss_policy: {severity: 0.22, activation_time_seconds: 8.0}}}
  - {scenario: configs/scenarios/phase2_single_engine.yaml, seed: 15032, split: ood_stress, difficulty_tier: 2, scenario_family: engine_only, severity_band: moderate, initial_state_overrides: {airspeed_kts: 152, pitch_deg: -5, roll_deg: 20}}
  - {scenario: configs/scenarios/phase2_actuator_turbulence_thrust.yaml, seed: 15033, split: ood_stress, difficulty_tier: 3, scenario_family: delay_disturbance_thrust, severity_band: moderate, failure_overrides: {actuator_delay_1: {severity: 0.55, parameters: {maximum_delay_seconds: 0.65}}, turbulence_1: {severity: 0.50}, thrust_loss_1: {severity: 0.55}}}
  - {scenario: configs/scenarios/phase2_rudder_crosswind.yaml, seed: 15034, split: ood_stress, difficulty_tier: 4, scenario_family: engine_control, severity_band: severe_in_domain, failure_overrides: {rudder_loss_1: {severity: 0.80}, crosswind_1: {severity: 0.75}}}
  - {scenario: configs/scenarios/phase2_engine_aileron.yaml, seed: 15035, split: ood_stress, difficulty_tier: 5, scenario_family: boundary_concurrent, severity_band: boundary, initial_state_overrides: {altitude_ft: 1500, airspeed_kts: 100, pitch_deg: -15, roll_deg: -40}, environment_overrides: {turbulence_intensity: 0.30}, failure_overrides: {aileron_loss_1: {severity: 0.85, activation_time_seconds: 2.0}}}
