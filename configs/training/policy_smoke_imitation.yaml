experiment_name: closed_loop_policy_smoke_v1
dataset_directory: datasets/policy_smoke_v1
split_manifest: datasets/policy_smoke_v1/split_manifest.json
output_directory: checkpoints/policy_smoke_v1
seed: 6300
device: cpu
architecture: {input_dim: 42, hidden_dimensions: [256, 128], activation: relu, predict_stabilization_targets: true, emergency_mode_count: 5}
batch_size: 256
learning_rate: 0.001
epochs: 8
weight_decay: 0.0001
gradient_clip_norm: 1.0
early_stopping_patience: 5
checkpoint_every_epochs: 2
clip_standard_deviations: 5.0
balance_emergency_modes: true
automatic_mixed_precision: false
num_workers: 0
resume_checkpoint: null
losses: {controls: 1.0, emergency_mode: 0.25, stabilization_targets: 0.1}

