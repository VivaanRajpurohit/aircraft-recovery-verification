[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aircraft-recovery-research"
version = "0.1.0"
description = "Simulation-only research prototype for AI aircraft recovery"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "torch>=2.3,<3",
  "z3-solver>=4.13,<5",
  "matplotlib>=3.8,<4",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "pytest-cov>=5.0,<8"]
replay3d = ["panda3d>=1.10.16,<1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
