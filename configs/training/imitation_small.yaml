experiment_name: phase3_small_imitation
dataset_directory: datasets/phase3_full
split_manifest: datasets/phase3_full/split_manifest.json
output_directory: checkpoints/phase3_small
seed: 4401
device: auto
architecture: {input_dim: 42, hidden_dimensions: [128, 64], activation: relu, predict_stabilization_targets: true, emergency_mode_count: 5}
