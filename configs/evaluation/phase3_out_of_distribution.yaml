evaluation_name: phase3_out_of_distribution
dataset_directory: datasets/phase3_full
split_manifest: datasets/phase3_full/split_manifest.json
checkpoint: checkpoints/phase3_default/best.pt
output_directory: results/phase3_out_of_distribution
aircraft_config: configs/aircraft/simple_twin.yaml
fallback_config: configs/controllers/fallback.yaml
device: auto
offline_splits: [ood]
disagreement_threshold: 0.1
scenarios:
  - {scenario: configs/scenarios/phase2_rudder_crosswind.yaml, category: unseen_combination, seed_offsets: [300, 301]}
  - {scenario: configs/scenarios/phase2_actuator_turbulence_thrust.yaml, category: three_failure, seed_offsets: [300, 301]}
  - {scenario: configs/scenarios/phase2_unrecoverable.yaml, category: unrecoverable, seed_offsets: [300]}
