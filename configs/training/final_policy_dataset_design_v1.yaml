supported_parameter_ranges:
  initial_airspeed_kts: [95, 180]
  initial_bank_deg: [-40, 40]
  initial_pitch_deg: [-15, 15]
  altitude_ft: [1200, 10000]
  terrain_clearance_ft: [500, 3000]
  failure_activation_seconds: [2, 8]
  surface_failure_severity: [0.20, 0.85]
  actuator_delay_seconds: [0.10, 0.80]
  sensor_bias_types: [airspeed_bias, altitude_bias, heading_bias]
  turbulence_intensity: [0.0, 0.30]
vertical_speed_plan:
  direct_initial_override_supported: false
  method: stratify measured vertical_speed_fpm at the end of a deterministic failure-free prelude
  warmup_duration_seconds: 2.0
  measurement_time_seconds: 2.0
  warmup_controller: DeterministicFallbackController
  failures_enabled_during_warmup: false
  declared_environment_disturbances_enabled: true
  bins_fpm: [[-2500, -750], [-750, -150], [-150, 150], [150, 750], [750, 2500]]
  boundary_convention: lower_inclusive_upper_exclusive_except_last_upper_inclusive
  target_balance: equal_within_each_tier_and_split_where_integer_counts_allow
sensor_noise_plan:
  gaussian_sensor_noise_enabled: false
  decision: excluded_from_final_generation_v1
  rationale: current simulator has deterministic bias faults but no audited pre-noise/post-noise observation contract
  future_required_fields: [pre_noise_observation, post_noise_observation, noise_draw, noise_seed, noise_model_version]
holdout_rules:
  flight_level_grouping: true
  seed_overlap_forbidden: true
  challenge_severity_values: [0.40, 0.65, 0.82]
  challenge_activation_seconds: [2.5, 5.0, 7.5]
  ood_severity_values: [0.22, 0.52, 0.85]
  ood_activation_seconds: [2.25, 5.5, 7.25]
  final_sealed_severity_values: [0.39, 0.64, 0.84]
  final_sealed_activation_seconds: [2.75, 5.25, 7.75]
  final_sealed_conditions_may_not_be_used_for_tuning: true
guards:
  generate_large_dataset: false
  open_final_sealed_test: false
  fit_final_preprocessing: false
  train_final_model: false
