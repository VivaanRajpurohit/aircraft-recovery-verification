family_parameter_semantics:
  nominal: {tier: 0, parameters: []}
  isolated_aileron_mild: {tier: 1, parameters: [component_severity, activation_seconds], component_mapping: {component_severity: reduced_aileron_effectiveness}}
  isolated_partial_thrust_mild: {tier: 1, parameters: [component_severity, activation_seconds], component_mapping: {component_severity: partial_thrust_loss}}
  isolated_engine_loss_mild_state: {tier: 1, parameters: [complete_engine_loss_severity, activation_seconds], component_mapping: {complete_engine_loss_severity: selected_left_or_right_engine}}
  isolated_aileron_moderate: {tier: 2, parameters: [component_severity, activation_seconds], component_mapping: {component_severity: reduced_aileron_effectiveness}}
  isolated_engine_loss_moderate_state: {tier: 2, parameters: [complete_engine_loss_severity, activation_seconds], component_mapping: {complete_engine_loss_severity: selected_left_or_right_engine}}
  deterministic_sensor_bias: {tier: 2, parameters: [sensor_bias_maximums, activation_seconds], component_mapping: {sensor_bias_maximums: selected_airspeed_altitude_or_heading_sensor}}
  isolated_actuator_delay: {tier: 2, parameters: [actuator_delay_seconds, activation_seconds], component_mapping: {actuator_delay_seconds: flight_controls}}
  engine_plus_aileron: {tier: 3, parameters: [complete_engine_loss_severity, component_severity, activation_seconds], component_mapping: {complete_engine_loss_severity: selected_engine, component_severity: reduced_aileron_effectiveness}}
  delay_plus_partial_thrust: {tier: 3, parameters: [actuator_delay_seconds, component_severity, activation_seconds], component_mapping: {actuator_delay_seconds: flight_controls, component_severity: partial_thrust_loss}}
  aileron_plus_turbulence: {tier: 3, parameters: [component_severity, turbulence_intensity, activation_seconds], component_mapping: {component_severity: reduced_aileron_effectiveness, turbulence_intensity: environment}}
  sensor_bias_plus_actuator: {tier: 3, parameters: [sensor_bias_maximums, actuator_delay_seconds, activation_seconds], component_mapping: {sensor_bias_maximums: selected_sensor, actuator_delay_seconds: flight_controls}}
  severe_engine_plus_aileron: {tier: 4, parameters: [complete_engine_loss_severity, component_severity, activation_seconds], component_mapping: {complete_engine_loss_severity: selected_engine, component_severity: reduced_aileron_effectiveness}}
  severe_delay_turbulence_partial_thrust: {tier: 4, parameters: [actuator_delay_seconds, turbulence_intensity, component_severity, activation_seconds], component_mapping: {actuator_delay_seconds: flight_controls, turbulence_intensity: environment, component_severity: partial_thrust_loss}}
  right_engine_rudder_crosswind: {tier: 4, parameters: [complete_engine_loss_severity, component_severity, crosswind_maximum_kts, activation_seconds], component_mapping: {complete_engine_loss_severity: right_engine, component_severity: reduced_rudder_effectiveness, crosswind_maximum_kts: environment}}
  severe_sensor_bias_plus_delay: {tier: 4, parameters: [sensor_bias_maximums, actuator_delay_seconds, activation_seconds], component_mapping: {sensor_bias_maximums: selected_sensor, actuator_delay_seconds: flight_controls}}
  boundary_engine_aileron: {tier: 5, parameters: [complete_engine_loss_severity, component_severity, activation_seconds], component_mapping: {complete_engine_loss_severity: selected_engine, component_severity: reduced_aileron_effectiveness}}
  boundary_sensor_delay: {tier: 5, parameters: [sensor_bias_maximums, actuator_delay_seconds, activation_seconds], component_mapping: {sensor_bias_maximums: selected_sensor, actuator_delay_seconds: flight_controls}}
  boundary_delay_turbulence: {tier: 5, parameters: [actuator_delay_seconds, turbulence_intensity, activation_seconds], component_mapping: {actuator_delay_seconds: flight_controls, turbulence_intensity: environment}}
  boundary_aileron: {tier: 5, parameters: [component_severity, activation_seconds], component_mapping: {component_severity: reduced_aileron_effectiveness}}
sealed_spacing_rule: choose deterministic interior midpoints between nonsealed support values; minimum spacing is recorded per factor and no model outcome is consulted
generation_authorized: false
