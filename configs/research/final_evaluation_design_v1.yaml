contract_id: final_evaluation_design_v1
experimental_unit: complete_flight
paired_key: [split, scenario_family, scenario_instance_id, simulator_seed]
controllers:
  - constant_idle
  - neutral_cruise
  - deterministic_expert
  - historical_phase3
  - smoke_checkpoint
  - final_neural_unmonitored
  - final_neural_monitored
primary_outcome: strict_recovery_success
primary_comparison: final_neural_monitored_vs_final_neural_unmonitored
secondary_outcomes:
  - strict_recovery_time_seconds
  - minimum_airspeed_kts
  - maximum_absolute_bank_deg
  - maximum_absolute_pitch_deg
  - minimum_terrain_clearance_ft
  - safety_violation_property_steps
  - safety_violation_duration_seconds
  - command_saturation_fraction
  - control_total_variation
  - monitor_modification_fraction
  - fallback_activation_count
  - fallback_duration_seconds
paired_execution:
  same_scenario_instance: true
  same_simulator_seed: true
  same_initial_state: true
  same_failure_timing_and_parameters: true
  same_disturbance_realization: true
  reset_controller_state_between_flights: true
confidence_intervals:
  confidence_level: 0.95
  binary: wilson_per_controller_and_paired_bootstrap_difference
  continuous: paired_flight_bootstrap
  bootstrap_resamples: 10000
  bootstrap_seed: 19001
multiple_comparisons:
  confirmatory_family: [final_neural_monitored_vs_final_neural_unmonitored]
  confirmatory_alpha: 0.05
  secondary_and_subgroup_status: exploratory
  exploratory_adjustment: benjamini_hochberg_fdr_0.10_with_unadjusted_effect_sizes_and_intervals_also_reported
missing_data: use_final_metrics_v1
final_sealed_test:
  execution_authorized: false
  tuning_prohibited: true
  one_post_freeze_evaluation_only: true
failure_preservation:
  library_path: artifacts/research_stage/failure_case_library_v1.json
  append_only: true
  required_fields: [case_id, source_split, scenario_instance_id, simulator_seed, controller_id, failure_reason, first_seen_utc, artifact_hashes]
  reused_for_training_becomes_ineligible_as_unbiased_evidence: true
