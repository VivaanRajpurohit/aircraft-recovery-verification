batch_name: diversion_extended_followup
output_directory: results/final_validation/extended_followup
checkpoint: checkpoints/phase3_quick/best.pt
safety_config: configs/safety/default.yaml
aircraft_config: configs/aircraft/simple_twin.yaml
fallback_config: configs/controllers/fallback.yaml
device: auto
repetitions: 5
seed_stride: 1000
bootstrap_seed: 6500
bootstrap_resamples: 5000
success_definitions:
  minimum_stall_margin_kts: 15.0
  minimum_overspeed_margin_kts: 15.0
  maximum_absolute_bank_deg: 30.0
  maximum_absolute_pitch_deg: 15.0
  stabilization_dwell_seconds: 5.0
  diversion_arrival_distance_nm: 1.0
  diversion_heading_tolerance_deg: 15.0
scenarios:
  - {scenario: configs/scenarios/validation_diversion_nominal.yaml, category: diversion_nominal, distribution: out_of_distribution}
  - {scenario: configs/scenarios/validation_diversion_single_engine.yaml, category: diversion_single_engine, distribution: out_of_distribution}
  - {scenario: configs/scenarios/validation_diversion_total_engine.yaml, category: diversion_glide, distribution: out_of_distribution}
  - {scenario: configs/scenarios/validation_diversion_crosswind.yaml, category: diversion_crosswind, distribution: out_of_distribution}
  - {scenario: configs/scenarios/validation_diversion_infeasible.yaml, category: diversion_infeasible_control, distribution: out_of_distribution}
  - {scenario: configs/scenarios/validation_diversion_navigation_invalid.yaml, category: diversion_navigation_invalid_control, distribution: out_of_distribution}
